<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Addon Locker</title>
    <link rel="stylesheet" href="../common/style.css?v=20260202">
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🦆</text></svg>">

    <!-- Metadata -->
    <meta name="description" content="Lock and protect your Stremio addons to prevent accidental modifications.">
    <meta property="og:title" content="Addon Locker">
    <meta property="og:description" content="Lock and protect your Stremio addons to prevent accidental modifications.">
    <meta property="og:type" content="website">
    <link rel="canonical" href="https://duckkota.gitlab.io/stremio-tools/addon-locker/">
</head>

<body class="centered">

    <!-- Main View: Locker -->
    <div id="view-main" class="view-section">
        <!-- Header Section -->
        <div class="header-section">
            <h1>Addon Locker</h1>
            <p class="subtitle">Control permissions for your addons</p>
        </div>

        <!-- Logged In Status -->
        <div id="loggedInHeader" class="text-center" style="display: none;">
            <!-- Content injected by JS -->
        </div>

        <!-- Main Card -->
        <div class="container pb-3">
            <form id="lockerForm">
                <!-- Login Section -->
                <div id="loginSection" class="auth-section">
                    <div class="field">
                        <div class="info-box">
                            <svg viewBox="0 0 24 24">
                                <path
                                    d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z" />
                            </svg>
                            <p>
                                <b>Log In</b>
                                <br>
                                Sign in to manage your addon permissions.
                            </p>
                        </div>

                        <label for="email">Stremio Email</label>
                        <div class="input-with-icon">
                            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2">
                                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z">
                                </path>
                                <polyline points="22,6 12,13 2,6"></polyline>
                            </svg>
                            <input type="email" id="email" placeholder="user@example.com" required autocomplete="email">
                        </div>
                    </div>

                    <div class="field">
                        <label for="password">Stremio Password</label>
                        <div class="input-with-icon">
                            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2">
                                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                            </svg>
                            <input type="password" id="password" placeholder="••••••••" required
                                autocomplete="current-password">
                        </div>
                    </div>

                    <button type="submit" id="loginBtn" class="mt-3">
                        Load Addons
                    </button>
                </div>

                <!-- Addons Section -->
                <div id="addonSection" class="hidden">
                    <!-- Filter/Search could go here later -->
                    <div id="addonContainer" class="addon-list">
                        <!-- Addon items injected by JS -->
                    </div>
                </div>
            </form>
        </div>
    </div>

    <!-- Web analytics and error tracking -->
    <script defer src='https://static.cloudflareinsights.com/beacon.min.js'
        data-cf-beacon='{"token": "da1cee1ff9f74d0d8b9c0f1a9fe3a820"}'>
        </script>

    <!-- Utilities -->
    <script src="../common/utils/ErrorHandler.js?v=20260202"></script>
    <script src="../common/utils/NavigationSidebar.js?v=20260202"></script>
    <script src="../common/utils/UIModal.js?v=20260202"></script>
    <script src="../common/utils/Network.js?v=20260202"></script>

    <!-- API -->
    <script src="../common/apis/StremioAPI.js?v=20260202"></script>

    <!-- App Logic -->
    <script src="js/AddonLocker.js?v=20260202"></script>
</body>

</html>
