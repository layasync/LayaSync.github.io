stages:
  - deploy
  - run

pages:
  stage: deploy
  image: alpine:latest
  script:
    # Frontend and styles
    - mkdir -p public/common
    - cp index.html public/
    - cp _headers public/
    - cp -r common/* public/common/

    # QuickStart
    - mkdir -p public/quickstart
    - cp -r quickstart/* public/quickstart/

    # CinePatch
    - mkdir -p public/cine-patch
    - cp -r cine-patch/* public/cine-patch/

    # Time Machine
    - mkdir -p public/time-machine
    - cp -r time-machine/* public/time-machine/

    # Cloner
    - mkdir -p public/cloner
    - cp -r cloner/* public/cloner/

    # Addon Locker
    - mkdir -p public/addon-locker
    - cp -r addon-locker/* public/addon-locker/

    # Cache Busting: Replace version placeholder with timestamp
    - find public -type f -name "*.html" -exec sed -i "s/v=20260202/v=$(date +%s)/g" {} +
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  artifacts:
    paths:
      - public
