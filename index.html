<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="common/style.css">

<body class="centered">
    <div class="header-section">
        <h1>Stremio Tools</h1>
        <p class="subtitle">Collection of useful tools for Stremio</p>
    </div>

    <ul class="tool-list">
        <!-- QuickStart -->
        <li class="tool-item">
            <a href="quickstart/" class="tool-card-link">
                <svg class="tool-icon" width="40" height="40" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z" />
                </svg>
                <span class="tool-title">QuickStart</span>
                <div class="tool-desc">Install AIOStreams in seconds</div>
            </a>
        </li>

        <!-- Time Machine -->
        <li class="tool-item">
            <a href="time-machine/" class="tool-card-link">
                <svg class="tool-icon" width="40" height="40" viewBox="0 0 24 24" fill="currentColor">
                    <path
                        d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8 8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z" />
                </svg>
                <span class="tool-title">Time Machine</span>
                <div class="tool-desc">Go back to when your Stremio setup was perfect</div>
            </a>
        </li>

        <!-- Cloner -->
        <li class="tool-item">
            <a href="cloner/" class="tool-card-link">
                <svg class="tool-icon" width="40" height="40" viewBox="0 0 24 24" fill="currentColor">
                    <path
                        d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z" />
                </svg>
                <span class="tool-title">Cloner</span>
                <div class="tool-desc">Clone configuration between accounts</div>
            </a>
        </li>
    </ul>

    <!-- Web analytics and error tracking -->
