<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Duck Tools (Clone)</title>
    <link rel="stylesheet" href="common/style.css?v=20260202">
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🦆</text></svg>">

    <!-- Metadata -->
    <meta name="description" content="Collection of useful tools for your streaming experience.">
    <meta property="og:title" content="Duck Tools">
    <meta property="og:description" content="Collection of useful tools for your streaming experience.">
    <meta property="og:type" content="website">
</head>

<body class="centered">
    <div class="header-section">
        <div class="mascot-wrapper">
            <span class="mascot" role="img" aria-label="Duck mascot">🦆</span>
        </div>
        <h1>Duck Tools</h1>
    </div>

    <ul class="tool-list">
        <!-- QuickStart -->
        <li class="tool-item">
            <a href="quickstart/" class="tool-card-link">
                <div class="tool-content-left">
                    <span class="tool-icon-wrapper">⚡</span>
                    <span class="tool-title">QuickStart</span>
                </div>
                <svg class="arrow-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M5 12h14M12 5l7 7-7 7" />
                </svg>
            </a>
        </li>

        <!-- Cloner -->
        <li class="tool-item">
            <a href="cloner/" class="tool-card-link">
                <div class="tool-content-left">
                    <span class="tool-icon-wrapper">↔️</span>
                    <span class="tool-title">Cloner</span>
                </div>
                <svg class="arrow-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M5 12h14M12 5l7 7-7 7" />
                </svg>
            </a>
        </li>

        <!-- Addon Butler -->
        <li class="tool-item">
            <a href="addon-butler/" class="tool-card-link">
                <div class="tool-content-left">
                    <span class="tool-icon-wrapper">🤵🏻‍♂️</span>
                    <span class="tool-title">Addon Butler</span>
                </div>
                <svg class="arrow-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M5 12h14M12 5l7 7-7 7" />
                </svg>
            </a>
        </li>
    </ul>

    <!-- Utilities -->
    <script src="common/utils/Logger.js?v=20260202"></script>
    <script src="common/utils/InputValidator.js?v=20260202"></script>
    <script src="common/utils/ErrorHandler.js?v=20260202"></script>
</body>

</html>
